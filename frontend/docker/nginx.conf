# Static file server for the single-page app, plus an optional same-origin API proxy (/api/* → the gateway).
# With API_URL=/api (cloud) the browser calls this origin only; with API_URL=http://localhost:8080 (local default) it calls the gateway directly.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  location = /healthz {
    default_type text/plain;
    return 200 'ok';
  }

  # Runtime configuration: never cached, so a changed API_URL takes effect on reload.
  location = /config.js {
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
  }

  # Same-origin API: /api/<path>?<query> → http://gateway:80/<path>?<query>. Method, body, query string and the
  # Authorization header pass through unchanged. Buffering is off so SSE (/orders/:id/tracking/stream) streams.
  # The gateway name is resolved per request (Docker DNS), so this container still starts without a gateway.
  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway http://gateway:80;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $gateway;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    client_max_body_size 100k;
  }

  # Hashed build assets can be cached for a long time.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # Client-side routing: unknown paths serve index.html.
  location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    try_files $uri /index.html;
  }
}
