# API gateway: routes by path prefix to each microservice. No business logic lives here.
events {}

http {
  # Docker's embedded DNS; resolving per-request lets the gateway start before every service is up.
  resolver 127.0.0.11 valid=10s ipv6=off;

  log_format json escape=json '{"time":"$time_iso8601","service":"gateway","method":"$request_method",'
                              '"path":"$uri","status":$status,"durationMs":$request_time,'
                              '"upstream":"$upstream_addr","requestId":"$request_id"}';
  access_log /dev/stdout json;

  client_max_body_size 100k;
  proxy_connect_timeout 3s;
  proxy_read_timeout 15s;

  map $uri $health_upstream {
    /health/auth    http://auth-service:4001/health;
    /health/catalog http://catalog-service:4002/health;
    /health/order   http://order-service:4003/health;
    /health/payment http://payment-service:4004/health;
    /health/billing http://billing-service:4005/health;
    /health/delivery http://delivery-service:4007/health;
  }

  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;

  server {
    listen 80;

    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_intercept_errors off;
    # Let browser clients (e.g. the dev testing console) read tracing/retry headers on CORS responses.
    add_header Access-Control-Expose-Headers "x-request-id, retry-after, idempotent-replayed" always;

    location = /health {
      default_type application/json;
      return 200 '{"status":"ok","service":"gateway"}';
    }

    location /auth/ {
      limit_req zone=auth_limit burst=20 nodelay;
      set $upstream http://auth-service:4001;
      proxy_pass $upstream;
    }

    location /restaurants {
      set $upstream http://catalog-service:4002;
      proxy_pass $upstream;
    }

    # Live order tracking (Server-Sent Events): no buffering, long-lived connection.
    # Regex locations win over the /orders prefix below.
    location ~ ^/orders/[^/]+/tracking/stream$ {
      set $upstream http://order-service:4003;
      proxy_pass $upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
    }

    location /orders {
      set $upstream http://order-service:4003;
      proxy_pass $upstream;
    }

    # Delivery partners (pickup, arrival, OTP verification) and operators. The Notification Service
    # and every broker/queue stay internal: they have no route here.
    location /deliveries {
      set $upstream http://delivery-service:4007;
      proxy_pass $upstream;
    }

    location /invoices {
      set $upstream http://billing-service:4005;
      proxy_pass $upstream;
    }

    location /discounts {
      set $upstream http://billing-service:4005;
      proxy_pass $upstream;
    }

    # Includes /payments/webhook: the body is forwarded byte-for-byte, as Stripe signature checks require.
    location /payments {
      set $upstream http://payment-service:4004;
      proxy_pass $upstream;
    }

    # Per-service health, e.g. /health/auth → auth-service /health
    location ~ ^/health/(auth|catalog|order|payment|billing|delivery)$ {
      proxy_pass $health_upstream;
    }

    location / {
      default_type application/json;
      return 404 '{"success":false,"error":{"code":"NOT_FOUND","message":"No route for this path"}}';
    }
  }
}
