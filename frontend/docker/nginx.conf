# Static file server for the single-page app. It never proxies API calls: the browser calls the API gateway directly.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  location = /healthz {
    default_type text/plain;
    return 200 'ok';
  }

  # Runtime configuration: never cached, so a changed API_URL takes effect on reload.
  location = /config.js {
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
  }

  # Hashed build assets can be cached for a long time.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # Client-side routing: unknown paths serve index.html.
  location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    try_files $uri /index.html;
  }
}
